<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Beak Gradient -->
    <linearGradient id="beakTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="50%" stop-color="#FFC107"/>
      <stop offset="100%" stop-color="#4CAF50"/>
    </linearGradient>

    <!-- Beak Lower Gradient -->
    <linearGradient id="beakBottom" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E64A19"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
  </defs>

  <!-- Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Toucan Body Base -->
  <path d="M 130,380 C 130,220 220,130 330,130 C 330,260 310,380 130,380 Z" fill="#111827"/>
  
  <!-- Breast / Throat Accent -->
  <path d="M 210,210 C 230,150 290,140 310,140 C 300,240 260,310 210,320 C 200,280 200,240 210,210 Z" fill="#FFF176"/>

  <!-- Large Beak (Upper) -->
  <path d="M 270,160 C 270,160 380,80 440,160 C 380,210 300,210 270,200 Z" fill="url(#beakTop)"/>

  <!-- Beak Tip/Accent -->
  <path d="M 400,132 C 420,140 440,160 440,160 C 410,185 385,180 385,180 Z" fill="#D81B60"/>

  <!-- Lower Beak -->
  <path d="M 270,200 C 300,210 370,205 385,180 C 340,220 280,215 270,200 Z" fill="url(#beakBottom)"/>

  <!-- Eye Patch (Blue) -->
  <circle cx="250" cy="180" r="28" fill="#29B6F6"/>

  <!-- Eye (Wide expression for "iSawIt") -->
  <circle cx="250" cy="180" r="16" fill="#FFFFFF"/>
  <circle cx="252" cy="180" r="9" fill="#0D47A1"/>
  <circle cx="255" cy="176" r="3" fill="#FFFFFF"/>
</svg>
